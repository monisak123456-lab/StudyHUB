<style>
:root{--bg:#eef2f7;--grid:rgba(20,33,61,.07);--card:#fff;--ink:#14213d;--mut:#556075;--line:#cdd6e4;--ok:#0f6b4c;--okbg:#d9f3e8;--no:#a1241a;--nobg:#fde4e1;--warn:#9a5b00;--a1:#0b7a6b;--a2:#c2255c;--a3:#c2560a;--a4:#5b3fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--grid:rgba(255,255,255,.05);--card:#18223a;--ink:#eef2fb;--mut:#a7b2c8;--line:#2d3a57;--ok:#7be8bd;--okbg:#0f3b2d;--no:#ffaaa1;--nobg:#4a1c19;--warn:#ffd27a}}
:root[data-theme="dark"]{--bg:#0f1624;--grid:rgba(255,255,255,.05);--card:#18223a;--ink:#eef2fb;--mut:#a7b2c8;--line:#2d3a57;--ok:#7be8bd;--okbg:#0f3b2d;--no:#ffaaa1;--nobg:#4a1c19;--warn:#ffd27a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:var(--bgi,linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px));background-size:var(--bgs,28px 28px);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(2.1rem,9vw,3.6rem);line-height:1.05;margin:8px 0 10px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:1.1rem;margin:0 0 22px;max-width:48ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:20px}
.tile{border:0;border-radius:22px;color:#fff;text-align:left;padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;font-family:inherit;font-size:1rem;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile b{display:block;font-size:2.1rem;font-weight:800;line-height:1.1;margin-bottom:6px}
.meta{font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--c,#5b3fd1);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.link{background:none;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.cat{font-weight:800;font-size:1.3rem;color:var(--c)}
.cnt{color:var(--mut);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.stats{display:flex;gap:18px;font-weight:600;margin-bottom:14px}
.stats .g{color:var(--ok)}.stats .r{color:var(--no)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px}
.q{font-size:1.25rem;font-weight:600;margin:0 0 14px}
.mut{color:var(--mut);margin:0 0 6px}
.ex{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;margin:0 0 14px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt b{color:var(--c);margin-right:6px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.opt.ok b,.opt.no b{color:inherit}
.opt:disabled{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.box{display:flex;flex-wrap:wrap;gap:8px;border:2px solid var(--ink);border-radius:10px;padding:10px;margin:0 0 16px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.chip.used{opacity:.4;text-decoration:line-through}
.psg{line-height:2.4;margin:0}
.psg h3{margin:0 0 6px;text-align:center}
.gi{border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;padding:2px 6px;margin-left:4px;text-align:center}
.gi.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.gi.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.fix{color:var(--ok);font-weight:600;margin-left:4px}
.exw{border-bottom:2px solid var(--ink)}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--nobg);color:var(--no)}
.btn{background:var(--c);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;margin:14px 10px 0 0}
.score{font-size:4.5rem;font-weight:800;line-height:1;color:var(--c);margin:6px 0}
.rev{margin:18px 0 0;padding:0;list-style:none}
.rev li{padding:12px 0;border-top:1px solid var(--line)}
.rev del{color:var(--no)}
.rev span{color:var(--ok);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-weight:600}
.sbar .g{color:var(--ok)}.sbar .r{color:var(--no)}
.paper{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;line-height:1.7;font-size:1.05rem}
.paper h2{margin:0 0 8px}
.paper p{margin:0 0 10px}
.exq{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin:0 0 6px;line-height:1.8}
.qx{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.qx p{margin:16px 0 4px}
.qx p.ok{color:var(--ok)}.qx p.no{color:var(--no)}
.bl{font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:4px 0 6px}
.ox{background:none;border:2px solid transparent;border-radius:8px;text-align:left;padding:6px 8px;font:inherit;color:var(--ink);cursor:pointer}
.ox:hover:not(:disabled){border-color:var(--c)}
.ox.ok{color:var(--ok);background:var(--okbg);font-weight:600}
.ox.no{color:var(--no);background:var(--nobg)}
.ox:disabled{cursor:default}
.mi{color:var(--no);font-weight:600}
h1.big{color:var(--c);font-size:clamp(2.6rem,12vw,4.4rem);letter-spacing:.03em}
.tile b.big{font-size:3rem;letter-spacing:.03em}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tb{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tb small{color:var(--mut);font-weight:400}
.tb:hover{border-color:var(--c)}
.paper h2.gh{font-size:clamp(2rem,9vw,3rem);letter-spacing:.03em;color:var(--c)}
.paper h3{margin:0 0 10px;font-size:1.4rem}
.tb{position:relative;overflow:hidden;gap:6px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.tb::before{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .7s;pointer-events:none}
.tb:hover{transform:translateY(-6px) scale(1.03);border-color:var(--c);box-shadow:0 16px 30px -14px var(--c)}
.tb:hover::before{left:130%}
.tn{font-size:1.1rem;transition:color .25s,letter-spacing .25s}
.tb:hover .tn{color:var(--c);letter-spacing:.02em}
.pls{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pl{border:0;border-radius:999px;color:#fff;font:inherit;font-size:.85rem;font-weight:600;padding:4px 12px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.pl:hover{transform:translateY(-2px) scale(1.1);box-shadow:0 6px 14px -6px #000}
.l0{background:#0f7b53}.l1{background:#c2560a}.l2{background:#b3261e}
.lv{font-size:.75rem;color:#fff;border-radius:999px;padding:2px 10px;vertical-align:middle;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){.tb,.tb::before,.pl{transition:none}.tb:hover,.pl:hover{transform:none}}
textarea{font-family:inherit}
.pad{display:block;width:100%;box-sizing:border-box;min-height:260px;padding:8px 14px;border:2px solid var(--line);border-radius:12px;background-color:var(--card);background-image:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);background-attachment:local;color:var(--ink);font-size:1.05rem;line-height:32px;resize:vertical}
.pad:focus{border-color:var(--c)}
.wst{margin:12px 0 6px;font-weight:600}
.wst .r{color:var(--no)}.wst .w{color:var(--warn)}
.prev{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;min-height:3rem;line-height:1.8}
mark{background:none;font-weight:600;text-decoration:underline wavy}
mark.sp{color:var(--no);text-decoration-color:var(--no)}
mark.gr{color:var(--warn);text-decoration-color:var(--warn)}
.iss{padding:0;list-style:none;margin:12px 0 0}
.iss li{padding:6px 0;border-top:1px solid var(--line)}
.tag{font-size:.8rem;font-weight:800;border-radius:6px;padding:1px 8px;margin-right:8px;color:#fff}
.tag.sp{background:#a1241a}.tag.gr{background:#9a5b00}
details{margin:0 0 6px;border:2px solid var(--line);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:600}
@media(prefers-reduced-motion:reduce){.tile,.bar i{transition:none}.shake{animation:none}}
@keyframes glow{0%,100%{box-shadow:0 6px 18px -8px var(--c)}50%{box-shadow:0 0 28px 3px var(--c)}}
@keyframes floaty{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(5px)}}
@keyframes shimmer{to{background-position:300% center}}
@keyframes okp{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 16px 2px var(--ok)}}
@keyframes nop{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 16px 2px var(--no)}}
@keyframes gtxt{0%,100%{text-shadow:0 0 6px transparent}50%{text-shadow:0 0 22px var(--c)}}
h1,h2,h3,.cat,.tn,.tile b,.score,.gh{font-family:var(--hf,'Bricolage Grotesque',system-ui,sans-serif)}
h1{background-image:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a4),var(--a1));background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 9s linear infinite;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--a1) 40%,transparent))}
.tile{position:relative;overflow:hidden;animation:revealUp .8s cubic-bezier(.22,.9,.3,1) backwards,glow 3.2s ease-in-out .8s infinite;animation-delay:calc(var(--i,0)*90ms),calc(.8s + var(--i,0)*.45s);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tile::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);transition:left .7s;pointer-events:none}
.tile:hover::after{left:130%}
.tile:nth-child(1):hover{transform:translateY(-8px) translateX(-4px) scale(1.04)}
.tile:nth-child(2):hover{transform:translateY(-10px) scale(1.06)}
.tile:nth-child(3):hover{transform:translateY(-8px) translateX(4px) scale(1.04)}
.tile:nth-child(4):hover{transform:translateY(-8px) skewX(-3deg) scale(1.03)}
.tile .ic{position:absolute;right:14px;bottom:6px;font-size:4.6rem;font-style:normal;opacity:.25;animation:floaty 4s ease-in-out infinite;pointer-events:none}
.tile b.big{font-size:clamp(1.7rem,7vw,2.5rem);letter-spacing:.04em;overflow-wrap:anywhere}
.score{animation:gtxt 2.4s ease-in-out infinite}
.ox.ok,.opt.ok,.gi.ok{animation:okp 1.2s ease-in-out 3}
.ox.no,.opt.no,.gi.no{animation:nop 1.2s ease-in-out 3}
.btn,.link,.ox,.chip,.th{transition:transform .2s,box-shadow .25s,border-color .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 22px -8px var(--c)}
.link:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 6px 16px -8px var(--c)}
.ox:hover:not(:disabled){transform:translateX(5px);box-shadow:0 0 12px -2px var(--c)}

/* ===== Theme scenes: animated backgrounds, mascots and effects for every theme ===== */
main{position:relative;z-index:1}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
#fx *{pointer-events:none}
#fx .fp{position:absolute;left:var(--x);top:var(--y,-10%);width:var(--s);height:var(--s);opacity:var(--o,.55);will-change:transform}
#fx .fp>svg,#fx .sc>svg{display:block;width:100%;height:100%;overflow:visible}
.a-fall{animation:fxFall var(--d) linear var(--dl) infinite backwards}
.a-rise{top:auto!important;bottom:-12%;animation:fxRise var(--d) linear var(--dl) infinite backwards}
.a-sway{animation:fxSway var(--d) linear var(--dl) infinite backwards}
.a-drift{animation:fxDrift var(--d) linear var(--dl) infinite backwards}
.a-float{animation:fxFloat var(--d) ease-in-out var(--dl) infinite alternate}
.a-twinkle{animation:fxTwinkle var(--d) ease-in-out var(--dl) infinite}
.a-spin{animation:fxSpinFloat var(--d) ease-in-out var(--dl) infinite alternate}
.a-glow{animation:fxFirefly var(--d) ease-in-out var(--dl) infinite alternate}
.a-shoot{animation:fxShoot var(--d) ease-in var(--dl) infinite backwards}
.a-swim{animation:fxSwim var(--d) linear var(--dl) infinite backwards}
@keyframes fxFall{from{transform:translate3d(0,-12vh,0) rotate(0)}to{transform:translate3d(var(--dx,4vw),115vh,0) rotate(var(--r,360deg))}}
@keyframes fxRise{from{transform:translate3d(0,0,0) scale(.8)}to{transform:translate3d(var(--dx,3vw),-118vh,0) scale(1.05)}}
@keyframes fxSway{0%{transform:translate3d(0,-12vh,0) rotate(0)}25%{transform:translate3d(5vw,18vh,0) rotate(90deg)}50%{transform:translate3d(-2vw,50vh,0) rotate(200deg)}75%{transform:translate3d(6vw,80vh,0) rotate(280deg)}100%{transform:translate3d(1vw,115vh,0) rotate(380deg)}}
@keyframes fxDrift{from{transform:translate3d(-30vw,0,0)}to{transform:translate3d(130vw,0,0)}}
@keyframes fxFloat{from{transform:translate3d(0,0,0) rotate(-6deg)}to{transform:translate3d(14px,-26px,0) rotate(8deg)}}
@keyframes fxTwinkle{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:var(--o,.9);transform:scale(1)}}
@keyframes fxSpinFloat{from{transform:translateY(0) rotate(0)}to{transform:translateY(-30px) rotate(var(--r,180deg))}}
@keyframes fxFirefly{0%{opacity:.08;transform:translate3d(0,0,0)}50%{opacity:var(--o,.9)}100%{opacity:.15;transform:translate3d(var(--dx,30px),-40px,0)}}
@keyframes fxShoot{0%,82%{opacity:0;transform:translate3d(0,0,0) rotate(-35deg)}86%{opacity:1}100%{opacity:0;transform:translate3d(-45vw,32vw,0) rotate(-35deg)}}
@keyframes fxSwim{from{transform:translate3d(-20vw,0,0)}50%{transform:translate3d(55vw,-18px,0)}to{transform:translate3d(130vw,0,0)}}

// Reading: [title, text]. {!word} = example gap, {word/alt} = gap to fill.

['New friends','My family recently moved to a new town and it was the beginning of the summer holidays. My {!parents} were both busy at work and I didn’t know anyone. So I decided to join some dancing classes as I thought it might be a way to {meet} people. But when I got there I nearly went home again as there seemed to be lots of married {couples}. Then I realised that was the class for {traditional} dances and I wanted to learn modern dance. When I found the correct room, some people came to talk to me and I soon {made} friends. After a few days I realised that I wasn’t very good at dancing. But then I never expected to {become} a brilliant dancer. All I wanted was to {get} to know some people. I found out one girl was a {neighbour} who lived in the next flat to ours and we had lots of things {in} common. She is now my {best} friend. We see {each} other every day. We get on well together and we never fall out. And one of my friends is now married to someone she met at that class.'],
['Dara’s study routine','Dara is a {!student} in grade twelve. She gets up at five o’clock {every} morning and reviews her lessons for an hour. At school she always {listens} carefully to her teachers and takes {notes}. After school she {practises/practices} English with her friends. She {wants} to be a doctor, so she studies {hard} every day.'],
['A trip to Siem Reap','Last month my family {!travelled/traveled} to Siem Reap by bus. We stayed in a small {hotel} near the centre. The next morning we visited Angkor Wat, which is the largest {temple} in the world. The weather was very {hot}, so we drank a lot of {water}. In the evening we {bought} some souvenirs at the night market. It was a wonderful {holiday}.']];
RD.push(
['My best friend','My best friend {!lives} next to my house. We {go} to the same school and we {sit} at the same desk. After class, we usually {play} football in the yard. On Sundays we {help} our parents and {study} together. She is very {kind} and I am happy to have her.'],
['A rainy day','It was a {!rainy} day, so we stayed {inside}. My mother made {hot} soup and my brother {watched} cartoons on TV. I {read} a funny book and later we {played} cards. By evening the rain had {stopped}, and we went for a walk.'],
['The village market','Every morning the village market is full of {!people}. Farmers {bring} fresh vegetables and {sell} them at low prices. Children {run} between the stalls while their mothers {choose} the best fruit. The air {smells} of fresh bread, and everybody {talks} happily.']);
RD.push(
['A visit to the doctor’s','Kimseng decided to visit the {!doctor} after his trip to the jungle. He was normally a tall, muscular person, but over the past {month} he had lost a lot of {weight}. He had also noticed that his ankles and knees had become rather {painful}. He thought that he might have eaten or drunk something {poisonous} or caught some kind of {infectious} disease. The doctor took some blood for tests and told Kimseng to come back in a week. When he returned, Kimseng felt quite {optimistic}. “Don’t worry,” said the doctor, “it’s nothing serious. You haven’t caught an incurable {disease} or anything terrible like that. It’s a simple virus, and you will need some {treatment}. Take these tablets twice a day for two weeks, and you’ll make a full {recovery}.”'],
['A friend in the rain','Last week I was walking home after playing {!tennis} when it started raining very heavily. “Oh no, I will get {soaked} before I reach home,” I thought. “I wish I had remembered to bring my {raincoat}.” But unfortunately I had left it at home. “How stupid of me! I always {forget} to bring it with me.” Luckily, just then a friend of mine passed in his car and {offered} me a lift. “Are you going home?” he asked, “or do you want to go for a {drink}?” “I think I’d rather you took me home,” I said. “If I don’t {change} my clothes, I know I will fall ill, and then I won’t {be able} to play in the tennis tournament next week. And I have been {practicing/practising} hard for the last month.” “I will wait for you to change if you like,” he told me. “I think it’s time you {relaxed} for a change. You have been worrying too much about things lately, and people who worry too much fall ill more easily. It’s got {nothing} to do with the rain.”'],
['Evening classes','Recently I decided to go to {!evening} classes twice a week. During the day, I work in a {secretarial} agency as a telephonist. It is not a very interesting {occupation} and I get bored. I also got tired of coming home every evening, putting a {frozen} meal in the oven and then watching TV. So, I decided to take up carpentry as a {hobby}. Perhaps I should give you an {explanation} for my choice. Learning a skill is a good {solution} to the problem of boring work. Also, I felt I was a {failure} because any time I tried to put up a shelf, for example, it always fell down. Now I am quite a {successful} woodworker. I am working on the {construction} of some furniture at the moment. And although there are only a few students in the class, I don’t feel any {embarrassment}. I’ve turned out to be the best student in the class!'],
['Leaving a job','I recently left my job in an {!advertising} agency after a disagreement with my boss. She accepted my {resignation} but warned me that because of the {economic} situation, I might have to get used to the idea of being {unemployed} for a while. I thought that she was trying to make a point, but after I had made over fifty {applications} to other companies, I realised that she was right. Although I am a {qualified} designer, I didn’t receive any offers of a job. After that I tried working from home, but it was not very {profitable}. Then I became an {employee} in a fast-food restaurant, even though my {earnings} were extremely low. I wish I had accepted early {retirement} from my old job. That is what I {disagreed} with my boss about!'],
['Opening of the new sports centre','The Champa Sport Centre, which has been completely {!rebuilt}, was reopened yesterday by the Minister for Sport. The building was {originally} used as a market, but was sold to Champa Council in 1981, and then {converted} into a sports hall. Local schools played football and basketball {indoors}, and keep-fit classes were held there. In 2001 the hall was damaged by a {fire} which broke out in the heating system. The hall could not be used, and remained empty while {discussion} continued about its future. It was then decided that the hall would be rebuilt, and an appeal for {money} was launched. Two years ago a local {businessman} offered {to pay} for the building work, and plans were drawn up. The new hall includes a swimming pool, running track and other {sports} facilities which can be {used} by anyone in the Champa area. The Minister made a speech in which he congratulated everyone involved.'],
['A working life','Well, I studied {!economics} at university, and then I was lucky because I got a {job} very quickly as an accountant in a local {department} store. It wasn’t exactly what I wanted, but you know, it was a first job. I stayed there for four years altogether. After three years I was {promoted} to accounts manager, and I decided to leave and I {applied} for other jobs in the area. But I had no luck getting a second job at all, and I was very short of {money}, so in the end I had to get a job working as a {waitress} in a restaurant. Well, it wasn’t very successful because I’m quite clumsy, you see. I kept dropping things, so after a few weeks they gave me the sack. And then, just by chance, I met an old friend who I {was} at university with, and he was working in {television}. He got me a job as a television researcher on a programme called “Business Today”. And after a {few months} really, they decided that they wanted younger {presenters} for the programme, and I got a job and I love it.'],
['Discipline in schools','In most countries, schools were much {!stricter} twenty-five years ago than they are today. Many parents are not at all happy with the present {situation} because they feel that teachers have lost the ability to {control} their classes. Some schools in particular have developed a very bad {reputation} for the way in which the students {conduct} themselves. They no longer seem to have any {respect} for the school or the teachers who work in it. Some experts feel that the reason for these new patterns of {behavior/behaviour} in schools is the result of {progressive} ideas in education. They feel that {discipline} has become weak because students have been given too much {freedom} to choose how they want to spend their time. It is no doubt a good idea that physical {punishment} as part of a traditional kind of education has vanished in most places. But nowadays in many schools no punishment at all is possible.'],
['Government gets involved in the bag debate','One of the biggest issues facing our society today is the {!problem} of how to dispose of our {rubbish} and, in particular, plastic bags, which cause serious damage to the {environment}. While these {pollute} our waterways, some retailers have taken steps to {stop} this from happening by introducing incentives to shoppers. For instance, some supermarkets are {charging} 400 riels a bag to customers to {encourage} them to bring their own bags. In some countries the government {introduced} a bag tax and {plastic} bag consumption went down by 90%. A study showed, however, that when they brought in this legislation, the sale of plastic bin liners immediately went up, which suggested that shoppers had been {recycling} their bags before by using them to line their rubbish bins. The government and the retail industry are now looking at other ways of {reducing} the use of plastic bags.'],
['Malaria','Malaria is a serious {!disease} that attacks people of all ages. It is caused by germs {carried} by mosquitoes. If a mosquito {bites} a person, the germs will be injected beneath the {skin} and a tiny red spot will soon {appear}. When the person is infected, he develops a high fever, and other symptoms, such as vomiting, will soon {follow}. He may be so sick that he {loses} consciousness. Mosquitoes usually {breed} in still ponds or drains or even in containers holding {stagnant} water. They {need} the still water to lay their eggs and to {keep} them safe.']);

function analyze(tx,t,fin){
 let is=[];
 for(const m of tx.matchAll(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)){

  if(SP[lw])is.push({i:m.index,n:w.length,t:'sp',m:'“'+w+'” → “'+SP[lw]+'”'});
  else if(CAP.has(lw)&&w[0]===lw[0])is.push({i:m.index,n:w.length,t:'gr',m:'Use a capital letter: “'+w+'” → “'+w[0].toUpperCase()+w.slice(1)+'”'});
 }
 for(const [re,f] of GR)for(const m of tx.matchAll(re)){const r=f(m);is.push({i:m.index+r[1],n:r[2],t:'gr',m:r[0]})}
 if(fin){const e=tx.trimEnd();if(e&&!/[.!?]["”’']?$/.test(e)){const m=e.match(/[A-Za-z]+$/);if(m)is.push({i:e.length-m[0].length,n:m[0].length,t:'gr',m:'End your last sentence with . ! or ?'})}}
 is.sort((a,b)=>a.i-b.i);let end=0;is=is.filter(x=>{if(x.i<end)return false;end=x.i+x.n;return true});
 const sp=is.filter(x=>x.t==='sp').length,gr=is.length-sp;
 const words=(tx.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length,sent=(tx.match(/[^.!?]*[A-Za-z][^.!?]*[.!?]/g)||[]).length;
 const low=tx.toLowerCase(),hits=t.k.split(',').filter(k=>low.includes(k)).length;
 let extra=0;const notes=[];
 if(words>=(S&&S.required||50)*.4&&hits<3){extra+=15;notes.push('Off topic (−15): write about “'+t.t+'”.')}
 if(words>=(S&&S.required||50)*.6&&sent<3){extra+=10;notes.push('Too few sentences (−10): write at least 3 complete sentences.')}
 const pen=Math.min(100,5*sp+4*gr+extra);
 return{is,sp,gr,words,notes,pen,score:Math.round(Math.min(words/(S&&S.required||50),1)*(100-pen))};
}

['Hard text 1: Then and Now','A. When I was a {!teenager}, my family didn’t have much. I used to walk quite far just to go to school. Now I drive or ride my motorbike everywhere. Every morning, I would get up at 5 am to help my mom do the {chores} or my dad in the rice fields. There was no {internet}, TV, or video games in my village like now, so my friends and I would play in the field outside with whatever we had. I think we just grew up in different {generations} B. Even though I moved to France and lived there for many years, I still have great {memories} from my {childhood} in Cambodia. I would go to the local market to get fresh vegetables and meat very early in the morning. Unlike now, we don’t have a fridge to store food, so we did food shopping everyday. We used to cook for our big families in the village and everyone loved the food. We would spend time talking and catching up at family gatherings. This doesn’t happen anymore and we basically {communicate} through our mobile phones most of the time. C. I miss having pen pals and writing letters. When I was still in school, I would write letters to my friends or relatives who lived in different cities. I used to get excited every time I saw letters in mailbox. There has been so much {change} since {then} I don’t think my kids understand that excitement! Now people just send text messages or make quick phone calls. I think people depend on {technology} such as internet, {computers}, or mobile phones a lot for communication and have no patience to wait for anything anymore!'],
['Hard text 2','It is always good to have good {!neighbours} because they are the first people who you go to {whenever} you are too happy or sometimes in need of something. Our next-door neighbours are the Tanejas, whose family {consists} of grandparents, parents and two children. The grandparents are the retired medical professionals, whereas the parents, i.e. the son and the daughter-in-law, are successful entrepreneurs. They are very kind and {generous}. They never show off their {wealth}. Whenever they are available, they call for the tea and coffee get-togethers, and whenever we get a chance, we invite them for snack parties and get-togethers. I remember how {difficult} the times we were when the pandemic hit the world in 2020. Their family helped us a lot with our medical {needs} I was also suffering from symptoms of COVID, so they consoled my parents and helped them in the best possible way they could and prescribed me medications. Instead of creating chaos they helped me {during} quarantine, supplied me with necessary medicines and arranged an Oxygen cylinder beforehand so that it could be used {wherever} it was required, as I had breathing problems for three days. I am thankful to God for {blessing} us with such wonderful neighbours.'],
['Hard text 3: Job Interview','What is a job interview? Well, {!generally} it is what follows after you have sent your CV to an employer who wants to know more about you. Nowadays, {employers} want to meet you in person and see what you look like and {discuss} your qualifications. There are {several} things you have to be careful about, for example, the way you dress for that first meeting. For men, it is better to {wear} formal clothes – a shirt, tie and it is {appropriate} to wear a jacket or blazer. Make sure your hair is tidy and looking your best. If you are a woman, it is {important} to look smart and not wear too much make up! Another important {point} is punctuality. Make sure you {arrive} on time. Never be late! They may think you are not very {reliable}. When you are in the actual {interview} answer the question clearly and directly and, if there is something you do not understand, ask them to {repeat} the question instead of giving wrong answer. Show that you are interested in the job but do not be overexcited. Relax, do your best and be yourself!!'],
['Hard text 4: Personal Space','More and more people live in large cities these days and this means that it is becoming more and more difficult to find space and time for ourselves. But for many people, personal {!privacy} is very important. In many homes, a few minutes in the bathroom is all the privacy that is {available}. Teenagers especially need their own personal space at home where they can feel {relaxed} and private. But, of course, not all teenagers are {lucky} enough to have room of their own. Where space is short, they often have to {share} a bedroom with a brother or sister. In that case, it’s a good {idea} for them to have a special area or corner of the room to {call} their own. It’s especially important for young people to have somewhere to {keep} their personal things. This may or may not a tidy place and it is not a good idea for parents to try and tell teenagers how to {organize} their space, as this is {likely} to lead to arguments. Parents can, however, {make} sure that there are enough storage space such as shelves, cupboards and boxes. This will {allow} the teenager to keep their space tidy if they want to.'],
['Hard text 5: Technology and the Young','Modern technology is changing and improving all the time. Every month, scientists {!invent} new gadgets and {equipment} to help us with our daily life, and {discover} new ways to make {existing} technology faster and better. Our homes are full of hardware (such as DVD players and computers) and {software} (such as computer games and MP3s) {Research} suggests, however, that it’s the young people who are the best able to deal with this change. Whereas teenagers have no problem {operating} a DVD player, their mums and dads and grandparents often find using new technology {complicated} and different. But if you’re a teenager who criticizes your parents for their {lack} of technological awareness, don’t be to hard in them! Sometime in the future, when you’ve got children of your own, your {ability} to deal with new technology will probably {decrease} and your children will feel more {comfortable} with new technology than you do. You won’t want them to criticize you, will you?'],
['Hard text 6: Save It','In recent years, the number of {!environmental} problems have increased dangerously. One of the most serious problems is changes to the {atmosphere} which has lead to the {greenhouse} effect; this is making the most climate warmer. It is already affecting several areas of the world with unusual {weather} causing droughts or heavy storms. Cutting down on {exhaust} fumes from vehicles would help solve the problem. Natural {resources} such as oil and coal are not endless, so using the forms of {energy} such as wind, sun, water and even sea waves would help preserve our planet. Very soon we will be able to drive cars in cities and towns that run {on} electricity – as much cleaner {fuel} than petrol. And we can also help to reserve finite resources by {recycling} things made of glass, aluminum, plastic and paper.'],
['Hard text 7: Media Hype','The mass media refers to the people and organizations that provide news and {!information} for the public. Until recently these were mainly {newspaper}, television, and radio. Today, computers play a very big part. The {Internet} is a computer system that allows millions of people around the world to {receive} and exchange information about almost anything. {Ordinary} post has been taken over by {email} which stands for {electronic} mail because it is sent and received via a computer. It is a system that allows people to send {mail} to each other quickly and cheaply. Ordinary post is now {referred} to as ‘snail mails and one wonders if the postman is a job in {danger} of extinction!'],
['Hard text 8: How to Learn Vocabulary','Students are under enormous {!pressure} to learn huge amount of vocabulary but they are rarely given {guidance} as to how to go about it. They have a {tendency} to try and learn long lists by heart, but this is hardly the most {efficient} approach in the problem. The golden rule is to do lots of {revision} at regular intervals. Secondly, students should concentrate on words with the highest {frequency}, particularly everyday words which also improve the students spoken {fluency}. They should also take every {opportunity} to use the words in communication. There is considerable psychological evidence that learners who like using the foreign language improve their oral {performance} and their overall {acquirement} of the language much more rapidly than students who are {reluctant} to practise the language in real situations.'],
['Hard text 9: EXAM SUCCESS','There are many ways of making {!sure} you do well in the FCE examination, both before and during the exam. If you don’t have much {experience} of examinations, read the following notes {carefully}. First of all, if you are taking the exam the next day, make sure you have a good night’s {rest}. Check that you know {exactly} where the exam is going to take place. You should not sit the exam on an {empty} stomach, so have a good breakfast – but don’t {overdo} it. Don’t forget to bring with you a pen, pencil and eraser. Try and get to the examination center in good time so you have {enough} time to find the right room. As soon as you get your {answer sheet}, take a deep breath, check your name and number and bring any {errors} to the attention of the supervisor immediately. Read the {instruction} carefully and take your time answering before the invigilator bring the exam to close.'],
['Hard text 10: THE INFO-REVOLUTION','We have all seen an enormous increase in the role of the mass {!media} in people’s lives. First of all, the growth of the {press}, of both serious and {popular} newspapers, has been tremendous. Public {opinion} is influenced by powerful {editors} who not only own our newspapers which often have a {circulation} of millions, but who also own television and radio {networks} in many different countries. The huge quantity of {information} that people have to deal with has rocketed with the advent of satellite and cable television. At the same time, more and more people have {access} to {personal} computers. Information available at home via the Internet is infinite.'],
['Hard text 11: School Report','Socheata started English Literature this term, and I am afraid that her {!introduction} to the subject has not been entirely {successful}. She has not shown much enthusiasm, and does not always pay {attention} in class. Her assignments are often {unreadable} because she is so untidy, and because of her {failure} to check her homework thoroughly. She failed to do any {revision} before the end of term test, and had poor results. She seems to have the {mistaken} idea that she can succeed without studying. She has also had many {absences} and has frequently arrived late for class. This has resulted in several {punishment}. Although, Socheata is a {gifted} student in some respects, she has not had a satisfactory term.'],
['Hard text 12: Why read books?','Is it worth reading books, since nowadays there are so many other forms of {!entertainment}? Some people say that even {paperback} books are expensive, and not everyone can {borrow} books from a library. They might add that television is more {exciting} and that viewers can relax as they watch their favourite {programmes}. All that may be true, but looks are still very {popular}. They encourage the reader to use his or her {imagination} for a start. You can read a {chapter} of a book, or just a few pages, and then stop. Of course, it may be so {gripping} that you can’t stop! There are many different kinds of books, so you can choose a crime {novel} or an autobiography, or a book which gives you interesting {information}. If you find it hard to choose, you can read {reviews}, or ask friends for ideas. Personally, I can’t do without books, but I can give up television easily enough. You can’t watch television at bus stops!'],
['Hard text 13','Logo Construction and Definition of 32 nd SEA GAMES The Cambodia 2023 Logo {!draws} inspiration from the Kingdom’s {remarkable} history and {heritage} -the Angkor Wat. The UNESCO World Heritage Site is not only a symbol and {identity} of Cambodia but is also the pride and joy of the Cambodians. The gold {color} was chosen as the main color of the logo to {symbolize} the kingdom and continuous progress in wealth, {health} and happiness. The {dragons} (Naga) are in the logo as it is the protector and {provides} stability for the Kingdom of Cambodia. The four Naga in green, red, blue and yellow colors, which are entwined as one, signifies unity and diversity in the South East Asia community. The four colors {represent} the diversity of the South East Asia {Community} that is united as one through the four Naga.'],
['Hard text 14: The Motto and the Mascots of 32nd SEA GAMES','The Motto of ‘Sport: {!Live} in Peace’ was inspired by everyday Cambodians who are currently enjoying the peace and {stability} in the kingdom. Sport is the catalyst for the {economic} and social transformation of the kingdom. The kingdom’s ambition in achieving the middle-income nation in 2030 must be met with a strong intent of continuous peace that will ultimately result in prosperity in wealth, health and {happiness} in the community. The mascots of Cambodia 2023 are two {rabbits} named Borey (Male) and Romdoul (Female) – in their traditional martial arts of Bokator attire. The {male} rabbit carries the name Borey which represents solidarity. The female rabbit takes its name from Romduol, the national {flower} for Cambodia. The rabbits were chosen as the mascot of Cambodia 2023 as it’s a lovable character in the Cambodia {folk} tales, that depicts strong {values} in the teaching of Buddhism- inspiring, fairness, justice, knowledge, and helpful in the community. The choice of the rabbits also highlights gender {equality} in sports.'],
['Hard text 15','A. disease C. height E. deserted G. patients I. pandemic B. income D. crisis F. dependent on H. political J. spread Covid-19 The Coronavirus pandemic is the defining global health {!crisis} of our time. Since its emergence late last year, the virus has {spread} to every continent except Antarctica. Cases are rising daily in Africa and South America, and Europe has taken over as the epicenter of the disease and more cases are now being reported every day than in China at the {heights} of its epidemic. Countries are racing to slow the spread of the {disease} by testing and treating {patients}, carrying out contact tracing, limiting travel, quarantining citizens, and cancelling large gatherings such as sporting events, concerts, and schools. The {pandemic} is moving like a wave-one that may yet crash on those least able to cope. But COVID-19 is much more than a health crisis. By stressing every one of the countries it touches, it has the potential to create devastating social, economic and {political} crises that will leave deep scars. We are in uncharted territory. Many of our communities are unrecognizable from even a week ago. Dozens of the world’s greatest cities are {deserted} as people stay indoors, either by choice or by government order. Across the world, shops, theatres, restaurants and bars are closing. Every day, people are losing jobs and {income}, with no way of knowing when normality will return. Small island nations, heavily {dependent on} tourism, have empty hotels and deserted beaches. The International Labor Organization estimates that 25 million jobs could be lost.'],
['Hard text 16: The Study of Flood Management in Cambodia','Cambodia is located in one of the most severe flood-vulnerable zones in {!mainland} Southeast Asia. Flooding is the country’s most recurrent and impactful hazard among other natural {hazards}. This hazard alone, observed in many river {basins}, has been inflicting huge damages on {livelihoods}, social infrastructure, and the country’s economy. This study {aims} to review the current status of flood hazards, impacts, driving factors, management capacity, and future research directions on floods in Cambodia. The findings of this study {suggested} that there is still a lack of flood- related {studies} on flood hazard mapping, risk and damage assessment, and future flood analysis in Cambodia. The existing related studies mainly {focused} on the Tonle Sap Basin and its tributaries, the Lower Mekong Basin, the whole Mekong River Basin, and some of the tributaries of the Mekong River in Cambodia. The fundamental driving {factors} of the current flooding in Cambodia are {impacts} of climate change, land-use change, water {infrastructure} development, and weather extremes.'],
['Hard text 17: The General Election in Cambodia 2023','Cambodia is set to {!hold} its general elections July 23. Around 9.7 million Cambodians nationwide will {vote} for 125 National Assembly seats. The {official} campaign period will occur July 1-21, with 18 political parties registered to contest. Campaign activities will probably increase in the run-up to the vote. Campaign rallies and parades are likely in major cities like Phnom Penh, but {local} authorities could implement restrictions on related events. The {ruling} Cambodia People’s Party (CPP) will likely attract the largest crowds; up to a few thousand people could attend any rallies. Protests by {pro-democracy} and rights activists and supporters of the disqualified Candlelight Party are also {possible}. Allegations of electoral fraud or the suppression of opposition parties could lead to civil unrest during and after the election. Gatherings will likely occur at prominent roadways and intersections, public squares, and landmarks. Popular rally locations in Phnom Penh include City Hall, Freedom Park, Veng Sreng Boulevard, and Wat Botum Park. Authorities will almost certainly bolster security in the lead-up to and on election day. Heightened {security} measures, including roadblocks, are possible during larger campaign events and at {polling} stations and counting centers. Authorities could shut down any political rallies or protests perceived to violate campaign restrictions. Clashes between security forces and {protesters} or rival groups of supporters are possible. Increased security measures can result in localized business and {transport} disruptions.'],
['Hard text 18: Kun Khmer','Pradal Serey or Kun Khmer is a combat sport that {!originated} in Cambodia. The official Khmer name of the sport is Kbach Kun Pradal Khmer. In Khmer, Pradal means fighting or boxing and Serey means {free}. Thus, Pradal Serey may be translated as "free fighting" or "free boxing". The sport consists of stand up striking and clinch fighting where the objective is to knock an {opponent} out, force a technical knockout, or win a {match} by points. Pradal Serey is most {well-known} for its kicking technique, which generates power from hip rotation rather than snapping the leg. Pradal Serey consists of four types of strikes: punches, {kicks}, elbows and knee strikes. The clinch is used to wear down the opponent. In the clinch, opponents battle for dominant position for short range strikes by way of elbows and knees. Cambodian fighters tend to {utilize} more elbow strikes than that of other martial arts in the region. In Pradal Serey, more victories come by way of an {elbow} technique than any other strikes. The story of Pradal Serey starts with the Khmer Empire. The Khmer Empire was founded in 802 A.D. at a time when many modern Southeast Asian countries didn’t {exist} yet. Martial arts were used by the military of the Khmer Empire. Pradal Serey has its root from the hand-to-hand combat used by the {military} of the Khmer Empire. In the Angkor era, both armed and unarmed {martial} arts were practiced by the Khmers.'],
['Hard text 19: 4.0 Industrial Revolution','Industry 4.0 is revolutionizing the way companies manufacture, improve and {!distributed} their products. Manufacturers are {integrating} new technologies, including Internet of Things (IoT), cloud computing and analytics, and AI and machine learning into their production facilities and throughout their operations. These smart factories are {equipped} with advanced sensors, embedded software and robotics that collect and {analyze} data and allow for better decision making. Even higher value is created when data from production operations is combined with operational data from ERP, {supply} chain, customer service and other enterprise systems to create whole new levels of visibility and insight from previously siloed information. These {digital} technologies lead to increased automation, predictive maintenance, self-optimization of process improvements and, above all, a new level of {efficiencies} and responsiveness to customers not previously possible. Developing smart factories provides an {incredible} opportunity for the manufacturing industry to enter the fourth {industrial} revolution. Analyzing the large {amounts} of big data collected from sensors on the factory floor ensures real-time visibility of manufacturing assets and can provide {tools} for performing predictive maintenance in order to minimize equipment downtime.'],
['Hard text 20: Global Food Crisis','The world faces a {!global} hunger crisis of unprecedented proportions. In just two years, the number of people facing, or at {risk} of, acute food insecurity {increased} from 135 million in 53 countries pre-pandemic, to 345 million in 79 countries in 2023. Fueled by conflict, climate shocks and COVID-19, the crisis is escalating as the war in Ukraine {drives up} the costs of food, fuel and fertilizers. Millions of people are struggling to put food on the table and are being driven closer to starvation in a storm of staggering proportions. We are at a critical {crossroads}. We need to rise to the challenge of meeting people’s immediate food needs, while at the same time supporting programs that build long-term resilience. The alternative is hunger on a {catastrophic} scale. WFP is prioritizing emergency action to prevent millions dying of hunger and help build and stabilize national food systems and related supply chains. We aim to support a record 171.5 million people in 2023, a significant increase on 128 million in 2021. We are {diversifying} our supplier base, promoting local food {procurement} and negotiating for humanitarian access and export waivers. Our operational needs are now at an all-time high of US$25.1 billion, with forecasted contributions of US$10 billion (or 40 percent). WFP has a plan for 2023 – the most {ambitious} in its history – but needs renewed and larger commitments to help deliver millions of people from disaster. We face a triple jeopardy: operational costs increase, the number of acutely hungry people rises to {unprecedented} levels and donors are squeezed by multiple demands. Without additional resources, WFP will be forced to continue drastic prioritization in many of the countries where we operate, including among {humanitarian} crises.'],
['Hard text 21: Measuring Global Poverty in an Unequal World','There is no single {!definition} of poverty. Our understanding of the extent of poverty and how it is changing {depends} on which definition we have in mind. In particular, richer and poorer countries set very different {poverty} lines in order to measure poverty in a way that is informative and {relevant} to the level of incomes of their citizens. For instance, while in the United States a person is counted as being in poverty if they live on less than {roughly} $24.55 per day, in Ethiopia the poverty line is set more than 10 times {lower} – at $2.04 per day. You can read more about how these comparable national poverty lines are {calculated} in this footnote. To measure poverty globally, however, we need to apply a poverty line that is {consistent} across countries. This is the goal of the International Poverty Line of $2.15 per day – shown in red in the chart – which is set by the World Bank and used by the UN to {monitor} extreme poverty around the world. We see that, in {global} terms, this is an extremely low threshold indeed – set to reflect the poverty lines adopted nationally in the world’s poorest countries. It marks an {incredible} low standard of living – a level of income much lower than just the cost of a healthy diet.'],
['Hard text 22: Inequality in Education','Educational inequality is the {!unequal} distribution of academic resources, including but not limited to school funding, qualified and {experienced} teachers, books, and technologies, to socially excluded communities. These communities tend to be historically disadvantaged and oppressed. Individuals {belonging} to these marginalized groups are often denied access to schools with adequate resources. Inequality leads to major {differences} in the educational success or efficiency of these individuals and ultimately suppresses {social} and economic mobility. Inequality in education is {broken} down in different types: regional inequality, inequality by sex, inequality by social stratification, inequality by {parental} income, inequality by parent occupation, and many more. Measuring educational efficacy {varies} by country and even provinces/states within the country. Generally, grades, GPA scores, test scores, dropout rates, college entrance statistics, and college {completion} rates are used to measure educational success. These are measures of an individual’s academic performance ability. When determining what should be {measured} in terms of the educational success of an individual, many scholars and academics suggest that GPA, {test} scores, and other measures of performance ability are not the only useful tools in determining efficacy.'],
['Hard text 23: Funan Techo Canal','The Funan Techo Canal is a proposed 180 km long {!canal} in Cambodia, connecting Phnom Penh {Autonomous} Port with Kep and the Gulf of Thailand. The canal would begin at the Takeo Canal of the Mekong River, {pass} through the Ta Ek Canal of the Bassac River and finally merge with the Ta Hing Canal of the Bassac River in Koh Thom district. It would {connect} Phnom Penh directly with the country’s only {deep-sea} port in Sihanoukville and the new port in Kampot. The current plan includes constructing three dams with {sluices} and eleven bridges. The canal will be 100 m {wide} and 5.4 m deep, supporting vessels up to 3,000 DWT. The target completion date is 2028. It is expected to cost 1.7 billion USD. The project is {funded} entirely by the China Bridge and Road Cooperation (CBRC), who is currently (March 2024) working on a feasibility study of the project. The project will be developed under a BOT (build-operate-transfer) contract. Currently Cambodia {relies} heavily on using Vietnamese ports, notably that of Cai Mep. The new canal would significantly {reduce} this dependency. Vietnam has also raised {environmental} concerns.'],
['Hard text 24: Social Media','Social media are {!interactive} technologies that facilitate the creation, sharing and aggregation of content, ideas, interests, and other forms of expression through virtual communities and networks. Social media refer to {forms} of media that involve interactive participation. While challenges to the {definition} of social media arise due to the variety of stand-alone and built-in social media services currently available, there are some common {features}: Social media apps are online platforms than enable users to create and share content and {participate} in social networking. User-generated content – such as text posts or comments, digital photos or videos, and {data} generated through all online interactions – is the lifeblood of social media. Users create service – specific profiles for website or app that are {designed} and maintained by the social media organization. Social media helps the development of online social {networks} by connecting a user’s profile with those of the other individuals or groups. The term social in regard to media suggests that platforms are user-centric and {enable} communal activity. As such, social media can be {viewed} as online facilitators or enhancers of human networks – webs of {individuals} who enhance social connectivity.'],
['Hard text 25: THE MOON FROM EARTH','As we know, the moon is the {!object} in the night sky. We can see it most clearly when it is full, meaning that it {appears} round to us. Some people think that it looks like a face of a man, because of the light and dark {areas} on it. Early people wondered about this strange object in the sky. Was it just a light or was it another planet like the earth? Some people even {considered} it to be a God. What people could learn about the moon when they could only use their eyes was {limited}, but nowadays, because of their research, {scientists} understand more about it. The first real research came in the early 17th century with the {invention} of the telescope on the moon, he {discovered} that its surface was covered by hilly regions as well as large flat areas, which he thought might be seas. He also {explained} that the moon and the earth are very different in both their size (the moon is smaller than the earth) and position in the {universe}. Italian society did not respond well to what he thought, however, because the {information} was so new.'],
['Hard text 26: Cambodian Independence','After Angkor, Cambodia {!remained} an important and powerful state up until the eighteen century. From the thirteen century on, however, it had to defend itself {against} two nations that gradually grew more and more powerful, Thailand in the west and Vietnam in the east. By the nineteen century, these two powers {competed} with each other to control Cambodia. To make matter worse, problems within the Cambodian royal family caused a number of civil {conflicts} with the opposite sides going to Thailand and Vietnam for protection. {during} the eighteen century, Cambodia became {involved} with another nation, France. When king Norodom asked the French for {protection} in 1863, it was not because he preferred {submission} to French rather than to Thailand or Vietnam, but because he regarded France as a less {dangerous} alternative, being so far away. At the same time, he hoped France could be used as a screen to {protect} his country from those that {threatened} it.'],
['Hard text 27: THE PURPOSE OF EDUCATION','Education is very {!important} in every country, because without it a country cannot {develop}. This is because countries are {made up} of people, and education aims to help them develop as {capable} individuals and responsible members of society. Every country is {different}, however, so every country, include our own, has the task of working out an educational {system} that is suitable for its own purposes. Various {approaches} can be taken, but here we will approach this task in two ways. Firstly, our pupils need sufficient knowledge about themselves and their environment to satisfy their needs and wishes. {secondly}, they need to develop those skills that are {necessary} for their development. These include such practical tasks as reading, writing, knowing how to obtain and use knowledge, solving problems of various degrees of {complexity} and working or playing with other people in a spirit of friendly {cooperation}'],
['Hard text 28: HOW DID BUDDHISM BEGIN?','Around the world there are many different {!cultures}, beliefs and religions. People follow many {religions}. These include Islam, Buddhism, Christianity, and Hinduism. The {majority} of people in Cambodia are Buddhist. {Buddhism} came to Cambodia many hundreds of years ago during the time of Angkor, but why and in what manner did Buddhism {begin}? We all want to be happy. Most people think that material things, like money, houses and cars, bring only {pleasure} and make us happy. But do they? We find things {attractive} and try to obtain them. When we have them, we still want more, because we are greedy. When we can’t {obtain} the things we are fond of, we feel angry. If we see others with more than we have, we feel {jealous}. So we neither feel happy nor do we make others happy. {Instead} when we feel angry or jealous, we feel like fighting and {killing} other people.'],
['Hard text 29: HOW FIRE BEGAN','At one time {!people} did not know how to make fire. We can {imagine} how the first person discovered it, probably by accident. People, perhaps children, playing with dried sticks, rubbed them together until, suddenly, a {spark} was produced. Such an achievement must have surprised them. What was it? Where did it come from? How long did it take to {discover} what this spark was? It moved. It had {energy}. The spark became a {flame} and grew. The flame became fire and spread. It was like the sun. They discovered that when something is {mixed} with fire, it must be changed. Was it magic? It seems to {contain} life. Could it be life itself? First must be controlled, or how can it be used? How long did it take to control it {effectively}? Until this could be done, it couldn’t be used to frighten wild animals away, keep people warm, cook food or make bricks. Someone must have discovered that water was the {opposite} of fire and could be used to put it out. Eventually, fire became helpful, but even now it still remains {dangerous}, because nobody can control it completely all the time.'],
['Hard text 30: FREEDOM AND RESPONSIBILITY','If everyone was given the {!freedom} to do as they liked, society would definitely {suffer}. This is because individuals make up and live as part of {society}. If we want freedom to do as we like, therefore, we must also accept {responsibility} for our actions. Freedom and responsibility go together: we can’t have the one {without} the other. The current need to {develop} human rights is an important aspect of the relationship between freedom and responsibility in society. If human rights are {intended} to express the need of the {individual} for rights and freedom, then society also requires rights and responsibilities from the individuals within it. Human rights {consist}, therefore, for the rights of society as well as the rights of the individual.'],
['Hard text 31: The Bear and The Travelers','Two travelers were walking {!slowly} along the country road. They were going to the city {because} they were looking for work. They were tired and they were {hungry}. Suddenly, in the woods in front of them, they saw a huge bear. The men were {terrified}. One of them {ran away}, climbed a tree, and hid. The other man fell to the {ground} and pretended to be {dead}. The bear came toward him. It bent down, sniffed him, and {whispered} something in his ear. Then it wandered away. The other man came down from the tree and went to see how his friend was. “The bear gave me some advice”, said his {companion}. He said “Next time you go on a journey, travel with {someone} who won’t leave you at the first sign of {danger}'],
['Hard text 32: A friend in the train','Last week I was walking home after playing {!tennis} when it started raining very heavily. “Oh no, I will get {soaked} before I reach home”, I thought. “I wish I had remembered to bring my {raincoat}”. But unfortunately, I had left it at home. “How stupid of me! I always {forget} to bring it with me”. Luckily just then a friend of mine passed in his car and {offered} me a lift. “Are you going home?”, he asked “Or do you want to go for a {drink}?”. “I think I’d rather you took me home”, I said. If I don’t {change} my clothes, I know I will fall ill, and then I won’t {be able} to play in the tennis tournament next week. And I have been {practicing} hard for the last month. “I will wait for you to change if you like”, he told me. “I think it’s time you {relaxed} for a changed. You have been worrying too much about things lately. And people who worry too much fall ill more easily. It’s got {nothing} to do with the rain”.'],
['Hard text 33: Movie Types','There are many ways to classify {!movies}, and perhaps the most basic is by general genre fiction, nonfiction, and hybrid {fiction}. Most feature films fall into the category of {docudrama} because the story line for the film has been invented. The characters and the {scenarios} are not real, and the {story} often presents fantasy-type {plot}. One such example is the Batman series, for everyone knows the Batman is not a real person. I love this {type} of movie when I was a child. Another category is the nonfiction movie. This popular movie style tells the story of the real person-living or dead – or an event. The word {hybrid} is also used to describe a type of car. {perhaps} the most famous example of this type of film is Titanic. In it, the director adds the romantic element of the {forbidden} love between two young people. With these three genres of film readily available to moviegoers, there is always something for {everyone} at the movie theater.'],
['Hard text 34: Christmas','Christmas is a family {!celebration} and many of the custom center on children. Before they go to bed on {Eve}, children hang up a pillow case or a sack for their presents. {traditionally}, it should be a stocking, but a stocking wouldn’t hold enough t {satisfy} today’s kids. While the children are {sleeping}, do the custom goes, Father Christmas or Santa Claus, comes (but {only} to children who have been good). He travels {from} the North Pole in a sleigh which is {pulled} by reindeer. After landing on the roof, Santa Claus climbs down the {chimney} and puts {present} in the sacks that children have left out.'],
['Hard text 35: Louis Armstrong','Louis Armstrong, who was born in 1890 and {!died} in 1971, was a very famous jazz musician. He used to be known as “Satchmo” and his nickname stayed with him all his {life}. As a child in New Orleans, he learnt to {play} the trumpet while he was living in a special home for children who {had} got into trouble with the police. When he had finished his stay in the home, he {joined} various bands and then he formed his own. Between 1925 and 1928 he made out 60 records. These records made him one {of} the first solo stars in the history of pop {music}. When he died, he had {been} making records and he had been touring all over the {world} for more than forty years, and he was just as popular {as} he had been before. He even had a number of pop record – What A Wonder World – {in} the 1960s.']];

const explainItemBase=explainItem;explainItem=function(it,ci,ti){const c=C[ci]||{},T=c.topics&&c.topics[ti],a=String(it.c||''),q=String(it.q||'');if(c.id==='comprehension'||c.id==='listening')return explainItemBase(it,ci,ti);if(it.rule||(T&&T[1]))return explainItemBase(it,ci,ti);const lo=q.toLowerCase(),ans=a.toLowerCase();if(c.id==='grammar'){if(/\bif\b/.test(lo))return /would have/.test(ans)?'Past unreal conditionals use “if + past perfect” and “would have + past participle.”':'This is a conditional sentence. Match the verb after “if” to whether the result is real, possible, or imagined.';if(/\bthan\b/.test(lo))return 'The word “than” signals a comparison. Use the comparative form, such as “safer” or “more useful.”';if(ans==='since'||ans==='for')return 'Use “since” with a starting point and “for” with a length of time.';if(/\bby the time\b/.test(lo)||/^had\s/.test(ans))return 'The past perfect (“had” plus a past participle) shows which of two past actions happened first.';if(/\b(passive|built|written|cleaned|visited|made)\b/.test(lo+' '+ans))return 'This is a passive form: use the correct form of “be” followed by a past participle.';if(/\bfewer\b|\bless\b/.test(ans))return 'Use “fewer” with countable plural nouns and “less” with uncountable amounts.';if(/\benjoy\b|\blook forward\b/.test(lo))return 'After “enjoy” and “look forward to,” use a verb ending in “-ing.”';if(/\bso\b/.test(ans)&&/\bthat\b/.test(lo))return 'Use “so + adjective + that” to show a result.';if(/\bwhere\b/.test(lo)&&/asked|wonder/i.test(lo))return 'In an indirect question, keep normal statement word order after the question word.'}if(c.id==='vocabulary'){const meaning=VOCAB_MEANINGS[ans];if(meaning)return '“'+a+'” means '+meaning+'. Put it back into the sentence to check that it fits.'}const complete=q.replace(/\.{4,}/,a);return c.id==='vocabulary'?'“'+a+'” is the choice that fits the meaning and word form. Read the completed sentence: “'+complete+'”.': 'Read the completed sentence: “'+complete+'”. The words around the blank provide the grammar clue.'};
const listeningPlayerBase=listeningPlayer;listeningPlayer=function(script,src){return '<div class="qcard listening-card"><div class="cat">🎧 Listen before you answer</div><p class="mut">Listen once for the main idea, then again for details. The transcript stays hidden until you choose to reveal it.</p><audio id="lesson-audio" src="'+esc(src||'')+'" preload="metadata"></audio><div class="feature-row"><button class="btn" onclick="playListening()">▶ Listen / replay</button><button class="link" onclick="pauseListening()">Pause / resume</button><button class="link" onclick="stopListening()">Stop</button><label class="mut">Speed <select id="listen-rate" class="feature-input" style="width:auto;display:inline-block;margin:0" onchange="setListeningRate()"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.15">Fast</option></select></label><button class="link" onclick="toggleTranscript()">Show transcript</button></div><div id="listen-transcript" class="reading-passage" hidden>'+esc(script)+'</div><p id="listen-status" class="tool-note" aria-live="polite">Press Listen to hear the audio. If the audio files are missing, a computer voice reads the script instead.</p></div>'};

 function P(n,anim,shape,o){

   const s=R(o.s[0],o.s[1]),d=R(o.d[0],o.d[1]),x=o.x?R(o.x[0],o.x[1]):R(-2,98),y=o.y?R(o.y[0],o.y[1])+'%':'-10%';
   h+='<span class="fp a-'+anim+(o.c?' '+o.c:'')+'" style="--x:'+x.toFixed(1)+'%;--y:'+y+';--s:'+s.toFixed(0)+'px;--d:'+d.toFixed(1)+'s;--dl:'+(-R(0,d)).toFixed(1)+'s;--o:'+(o.o||.55)+';--dx:'+R(-6,6).toFixed(1)+'vw;--r:'+R(-540,540).toFixed(0)+'deg">'+(typeof shape==='function'?shape(i):shape)+'</span>';

 function mcBlock(kind){
  const base={grass:'#8a5a35',stone:'#8b8b8b',diamond:'#8b8b8b',gold:'#8b8b8b',wood:'#a8814f'}[kind];
  let b=px(0,0,8,8,base);
  const sp=kind==='grass'?'#6b4428':kind==='wood'?'#7d5c33':'#6f6f6f';
  [[1,5],[4,6],[6,3],[2,2],[5,1]].forEach(p=>b+=px(p[0],p[1],1,1,sp));
  if(kind==='grass'){b+=px(0,0,8,2,'#5fa83a')+px(0,2,1,1,'#5fa83a')+px(3,2,2,1,'#5fa83a')+px(7,2,1,1,'#5fa83a')+px(2,0,1,1,'#6fc24a')+px(6,1,1,1,'#4c8f2c')+px(1,6,1,1,'#a06a40')}
  if(kind==='diamond'||kind==='gold'){const o=kind==='diamond'?['#5ef2e5','#1fa39a']:['#ffe14d','#c99a00'];[[1,1],[2,2],[5,4],[6,5],[2,6],[5,1]].forEach((p,i)=>b+=px(p[0],p[1],1,1,o[i%2]))}
  if(kind==='wood')b+=px(0,0,8,1,'#c4a06a')+px(3,0,1,8,'#7d5c33');
  return svg('0 0 8 8',b+'<rect width="8" height="8" fill="none" stroke="rgba(0,0,0,.35)" stroke-width=".5"/>','shape-rendering="crispEdges"');
 }
